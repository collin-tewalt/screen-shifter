[package]
name = "screen-shifter"
version = "0.9.0"
edition = "2024"
license = "MIT"

[dependencies.windows]
version = "0.62.2"
features = [
    "ApplicationModel",
    "Foundation",
    "System",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_Packaging_Appx",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Recovery",
    "Win32_System_Registry",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

# Optimized debug builds: the per-pixel capture loop is ~50x slower unoptimized,
# which made debug runs unrepresentative of release timing. Logs stay on.
[profile.dev]
opt-level = 2
# A panic anywhere (including the hooks thread) shows every saved window, then ends the
# process; the next start takes them back. Unwinding would leave the app running out of sync.
panic = "abort"

[profile.release]
panic = "abort"
