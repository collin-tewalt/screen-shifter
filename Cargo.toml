[package]
name = "screen-shifter"
version = "0.1.0"
edition = "2024"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Optimized debug builds: the per-pixel capture loop is ~50x slower unoptimized,
# which made debug runs unrepresentative of release timing. Logs stay on.
[profile.dev]
opt-level = 2
